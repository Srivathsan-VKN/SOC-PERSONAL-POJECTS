[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "triage-assistant"
version = "0.1.0"
description = "AI-powered SOC alert triage assistant — Wazuh + Llama 3.1"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Srivathsan ", email = "vknsrivathsancareer@gmail.com" }
]
dependencies = [
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "opensearch-py>=2.4",
    "ollama>=0.3",
    "mitreattack-python>=6.0",
    "nvdlib>=0.7.6",
    "structlog>=24.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.30",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "syrupy>=4.6",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
triage = "triage_assistant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/triage_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
